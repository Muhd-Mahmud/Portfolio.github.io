<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brushed-silver metallic gradient (matches Lab chrome thumbnails) -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="18%" stop-color="#9ca3af"/>
      <stop offset="38%" stop-color="#f3f4f6"/>
      <stop offset="58%" stop-color="#6b7280"/>
      <stop offset="78%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="mFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e5e7eb"/>
      <stop offset="55%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>

  <!-- Rounded metallic tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#chrome)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <!-- Specular sheen -->
  <rect x="2" y="2" width="60" height="26" rx="14" fill="#ffffff" fill-opacity="0.18"/>

  <!-- The "M" with metallic fill + embossed highlight/shadow -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="42"
        fill="#1f2937" fill-opacity="0.35" transform="translate(1,1.5)">M</text>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="42"
        fill="url(#mFill)" stroke="#374151" stroke-opacity="0.4" stroke-width="0.5">M</text>
</svg>
